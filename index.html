<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Roman Numeral Converter</title>
</head>
<body>
    <header id="pre-section">
        <img src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg" alt="">
        <h1>roman numeral converter</h1>
    </header>
    <section id="input-section">
        <label for="number">Enter a Number:</label>
        <input type="number" id="number">
        <button id="convert-btn">Convert</button>
    </section>
    <section id="output-section">
        <span id="output"></span>
    </section>
</body>
<script src="./script.js">
</script>
</html>

<!-- 
User Stories:

You should have an input element with an id of "number" DONE
You should have a button element with an id of "convert-btn" DONE
You should have a div, span or p element with an id of output DONE
When you click on the #convert-btn element without entering a value into the #number element, the #output element should contain the text "Please enter a valid number" DONE
When the #number element contains the number -1 and the #convert-btn element is clicked, the #output element should contain the text "Please enter a number greater than or equal to 1"  DONE
When the #number element contains the number 4000 or greater and the #convert-btn element is clicked, the #output element should contain the text "Please enter a number less than or equal to 3999" DONE
When the #number element contains the number 9 and the #convert-btn element is clicked, the #output element should contain the text "IX"
When the #number element contains the number 16 and the #convert-btn element is clicked, the #output element should contain the text "XVI"
When the #number element contains the number 649 and the #convert-btn element is clicked, the #output element should contain the text "DCXLIX"
When the #number element contains the number 1023 and the #convert-btn element is clicked, the #output element should contain the text "MXXIII"
When the #number element contains the number 3999 and the #convert-btn element is clicked, the #output element should contain the text "MMMCMXCIX"
Fulfill the user stories and pass all the tests below to complete this project. Give it your own personal style. Happy Coding!
 -->
